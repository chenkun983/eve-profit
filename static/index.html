<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVE 制造利润分析器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <h1>🛸 EVE 制造利润分析器</h1>
    </div>
    <div class="header-right">
      <span class="subtitle">SDE: <span id="sdeStatus">检查中...</span></span>
      <span id="loginStatus" class="login-status" onclick="showLogin()">未登录</span>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('categories')">📦 市场查询</button>
    <button class="nav-tab" onclick="switchTab('ranking')">🏆 利润排行</button>
    <button class="nav-tab" onclick="switchTab('estimate')">⛏ 矿物估价</button>
    <button class="nav-tab disabled" disabled>🏭 工业管理</button>
  </nav>

  <div class="main-layout">
    <!-- 侧栏：只在分类页面显示 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span>📂 物品分类</span>
      </div>
      <div id="categoryTree" class="category-tree">加载分类中...</div>
    </aside>

    <!-- 遮罩层（手机端侧栏展开时） -->
    <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

    <main class="content">
      <!-- 分类页面 -->
      <div id="pageCategories">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="输入物品中文名搜索" autofocus oninput="searchInputChanged()">
          <div id="searchResults" class="search-results"></div>
        </div>

        <div id="categoryItems" class="category-items" style="display:none">
          <div class="category-items-header">
            <span id="categoryLabel">分类名称</span>
            <span id="categoryCount" class="count-badge">0</span>
          </div>
          <div id="categoryItemList" class="category-item-list"></div>
        </div>

        <div class="config-bar">
          <div class="config-group">
            <label>星系成本</label>
            <input type="number" id="cfgSci" value="3" min="0" max="30" step="0.1"> %
            <label>建筑效率</label>
            <input type="number" id="cfgBonus" value="4" min="0" max="20" step="0.1"> %
            <label>设施税</label>
            <input type="number" id="cfgTax" value="1" min="0" max="10" step="0.1"> %
            <label>蓝图ME</label>
            <input type="number" id="cfgMe" value="10" min="0" max="10" step="1">
            <label>蓝图TE</label>
            <input type="number" id="cfgTe" value="20" min="0" max="20" step="1">
          </div>
        </div>

        <div id="resultArea" class="result-area" style="display:none"></div>
      </div>

      <!-- 排行页面 -->
      <div id="pageRanking" style="display:none"></div>

      <!-- 估价页面 -->
      <div id="pageEstimate" style="display:none">
        <div class="config-bar">
          <div class="config-group">
            <label>化矿率</label>
            <input type="number" id="estRate" value="55" min="0" max="100" step="1"> %
            <button class="btn-primary" onclick="doEstimate()" style="padding:6px 16px">开始估价</button>
          </div>
        </div>
        <div style="margin-bottom:8px">
          <textarea id="estInput" style="width:100%;height:200px;padding:12px;border:1px solid #30363d;border-radius:8px;background:#161b22;color:#c9d1d9;font-size:14px;resize:vertical" placeholder="从游戏中复制物品清单粘贴到这里&#10;格式: 物品名称 数量&#10;例如:&#10;斜长岩 1000&#10;凡晶石 5030&#10;三钛合金 20000 矿物"></textarea>
        </div>
        <div id="estResult" class="result-area" style="display:none"></div>
      </div>
    </main>
  </div>
</div>

<script src="/static/auth.js"></script>
<script src="/static/app.js"></script>

<!-- 登录弹窗 -->
<div id="loginModal" class="modal" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <h3>登录 / 注册</h3>
      <button class="modal-close" onclick="hideLogin()">✕</button>
    </div>
    <div class="modal-body">
      <input type="text" id="loginUser" placeholder="用户名" class="modal-input">
      <input type="password" id="loginPass" placeholder="密码" class="modal-input">
      <div id="loginMsg" class="modal-msg"></div>
      <div class="modal-btns">
        <button class="btn-primary" onclick="doLogin()">登录</button>
        <button class="btn-secondary" onclick="doRegister()">注册</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
